<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="茶卡盐湖天空之镜插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb7ea"/>
      <stop offset=".55" stop-color="#a5dcf4"/>
      <stop offset="1" stop-color="#e8f7fb"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7e2f0"/>
      <stop offset="1" stop-color="#f2fafb"/>
    </linearGradient>
  </defs>
  <!-- 天空 -->
  <rect width="800" height="290" fill="url(#sky)"/>
  <!-- 云朵（上下对应实现倒影感） -->
  <g fill="#ffffff" opacity=".95">
    <ellipse cx="150" cy="80" rx="70" ry="22"/>
    <ellipse cx="200" cy="72" rx="40" ry="18"/>
    <ellipse cx="620" cy="60" rx="90" ry="22"/>
    <ellipse cx="690" cy="54" rx="46" ry="16"/>
    <ellipse cx="380" cy="150" rx="58" ry="16"/>
    <ellipse cx="430" cy="146" rx="34" ry="12"/>
  </g>
  <!-- 远雪山 -->
  <path d="M0 290 L120 210 L180 260 L260 200 L340 268 L430 224 L520 285 Z" fill="#e6eef2"/>
  <path d="M180 260 L260 200 L300 232 L260 258 Z" fill="#fff"/>
  <!-- 盐滩地平线 -->
  <rect y="290" width="800" height="10" fill="#eef7f6"/>
  <!-- 镜面盐湖 -->
  <rect y="300" width="800" height="200" fill="url(#mirror)"/>
  <!-- 倒影 -->
  <g fill="#cfe7f0" opacity=".9">
    <ellipse cx="150" cy="420" rx="70" ry="18"/>
    <ellipse cx="620" cy="440" rx="90" ry="18"/>
    <ellipse cx="380" cy="352" rx="58" ry="13"/>
  </g>
  <path d="M0 470 L180 390 L260 430 L340 385 L430 420 L520 455 Z" fill="#dfeff4" opacity=".7"/>
  <!-- 红衣人像（画面主角） -->
  <circle cx="400" cy="352" r="9" fill="#d9441f"/>
  <path d="M391 362 q9 -14 18 0 l0 30 h-18 Z" fill="#c03815"/>
  <ellipse cx="400" cy="462" rx="11" ry="4" fill="#d9441f" opacity=".55"/>
  <!-- 盐花点缀 -->
  <g fill="#ffffff" opacity=".85">
    <rect x="80"  y="330" width="26" height="3" rx="1.5"/>
    <rect x="520" y="360" width="34" height="3" rx="1.5"/>
    <rect x="240" y="420" width="22" height="3" rx="1.5"/>
    <rect x="680" y="330" width="24" height="3" rx="1.5"/>
  </g>
</svg>
