<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="丽江古城与雪山插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6f9e"/>
      <stop offset=".45" stop-color="#d9a1a0"/>
      <stop offset=".75" stop-color="#f4c98e"/>
      <stop offset="1" stop-color="#f8e3bb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- 玉龙雪山 -->
  <path d="M120 330 L300 110 L380 200 L460 150 L520 230 L620 330 Z" fill="#b8bfd4"/>
  <path d="M300 110 L340 170 L300 150 L270 190 Z M300 110 L330 150 L382 200 L380 160 L300 110 Z" fill="#ffffff" opacity=".95"/>
  <path d="M460 150 L492 205 L500 240 L520 230 Z" fill="#fff" opacity=".8"/>
  <path d="M200 330 L300 110 L400 330 Z" fill="#c3ccdf" opacity=".5"/>
  <!-- 晚霞云 -->
  <g fill="#ffefd6" opacity=".6">
    <ellipse cx="150" cy="140" rx="60" ry="12"/>
    <ellipse cx="200" cy="132" rx="36" ry="10"/>
    <ellipse cx="640" cy="120" rx="70" ry="12"/>
  </g>
  <!-- 前景老城屋顶 -->
  <g>
    <path d="M0 470 L0 380 L70 340 L140 380 L210 344 L280 380 L350 348 L420 388 Z" fill="#4d4238"/>
    <path d="M0 380 L70 340 l0 40 L0 420 Z" fill="#6a5a4a"/>
    <path d="M210 344 L280 380 l0 40 l-70 -36 Z" fill="#5a4c3e"/>
    <path d="M0 470 L420 470 L420 418 L0 418 Z" fill="#3a3129"/>
    <g fill="#2e271f"><rect x="40" y="428" width="16" height="26"/><rect x="120" y="428" width="16" height="26"/><rect x="200" y="428" width="16" height="26"/><rect x="300" y="428" width="16" height="26"/></g>
  </g>
  <g>
    <path d="M430 470 L430 380 L520 336 L610 386 L700 344 L800 392 L800 470 Z" fill="#51463b"/>
    <path d="M430 380 L520 336 l0 42 L430 420 Z" fill="#6d5d4c"/>
    <path d="M610 386 L700 344 l0 44 L610 430 Z" fill="#5f5141"/>
    <path d="M430 470 L800 470 L800 420 L430 420 Z" fill="#3d342b"/>
    <g fill="#2e271f"><rect x="480" y="430" width="16" height="24"/><rect x="560" y="430" width="16" height="24"/><rect x="660" y="430" width="16" height="24"/><rect x="740" y="430" width="16" height="24"/></g>
  </g>
  <!-- 暖窗 -->
  <g fill="#ffc977" opacity=".95">
    <rect x="46" y="404" width="8" height="12"/><rect x="126" y="404" width="8" height="12"/>
    <rect x="206" y="404" width="8" height="12"/><rect x="306" y="404" width="8" height="12"/>
    <rect x="486" y="404" width="8" height="12"/><rect x="566" y="404" width="8" height="12"/>
    <rect x="666" y="404" width="8" height="12"/><rect x="746" y="404" width="8" height="12"/>
  </g>
  <!-- 飞檐角 -->
  <path d="M70 340 q14 -14 0 -10 M280 380 q10 -12 0 -8" stroke="#f4c98e" stroke-width="2" fill="none"/>
  <circle cx="200" cy="96" r="3" fill="#fff"/>
</svg>
