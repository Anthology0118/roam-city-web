<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="乌镇水乡插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9e4"/>
      <stop offset="1" stop-color="#f3efe2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc5bb"/>
      <stop offset="1" stop-color="#e4efea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="120" cy="80" r="24" fill="#fff6dc" opacity=".85"/>
  <!-- 远岸绿带 -->
  <path d="M0 252 q200 -40 400 -10 q200 20 400 -8 L800 252 L0 252 Z" fill="#9cb28a"/>
  <!-- 对岸白墙黛瓦建筑带 -->
  <g>
    <rect x="0" y="252" width="800" height="6" fill="#4a4a44"/>
    <g fill="#f0ece0">
      <rect x="30" y="262" width="110" height="66"/><rect x="180" y="262" width="120" height="66"/>
      <rect x="600" y="262" width="120" height="66"/><rect x="40" y="262" width="90" height="66"/>
    </g>
    <g fill="#6a6a5f">
      <rect x="30" y="258" width="120" height="10"/><rect x="180" y="258" width="130" height="10"/>
      <rect x="600" y="258" width="130" height="10"/>
    </g>
    <g fill="#4a4a44">
      <rect x="30" y="256" width="120" height="8"/><rect x="180" y="256" width="130" height="8"/>
      <rect x="600" y="256" width="130" height="8"/>
    </g>
    <g fill="#8b6f4f"><rect x="80" y="278" width="12" height="14"/><rect x="230" y="278" width="12" height="14"/><rect x="660" y="278" width="12" height="14"/></g>
    <rect x="40" y="320" width="100" height="6" fill="#4a4a44"/>
    <rect x="190" y="320" width="110" height="6" fill="#4a4a44"/>
    <rect x="600" y="320" width="110" height="6" fill="#4a4a44"/>
  </g>
  <!-- 河面 -->
  <rect y="330" width="800" height="110" fill="url(#water)"/>
  <path d="M0 350 h130 M200 372 h150 M420 348 h120 M560 390 h150 M720 362 h70" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <!-- 石拱桥（中景） -->
  <path d="M352 330 L352 208 q64 -52 96 0 L448 330 L448 250 L418 330 Z" fill="#cfc09a"/>
  <path d="M352 330 L448 330 L448 250 L352 250 Z" fill="#cfc09a"/>
  <path d="M352 208 q64 -52 96 0 l-6 18 q-42 -30 -84 0 Z" fill="#e0d2ae"/>
  <path d="M356 336 L356 250 L444 250 L444 336 L414 336 L414 262 L386 262 L386 336 Z" fill="#a8b5b0" opacity="0"/>
  <!-- 拱洞 -->
  <path d="M370 340 q30 -120 60 0 Z" fill="#7f9f9a"/>
  <rect x="352" y="330" width="96" height="14" fill="#a89873"/>
  <!-- 桥栏柱 -->
  <g fill="#b7a77f">
    <rect x="356" y="206" width="6" height="20"/><rect x="376" y="196" width="6" height="20"/>
    <rect x="418" y="196" width="6" height="20"/><rect x="438" y="206" width="6" height="20"/>
  </g>
  <rect x="352" y="200" width="96" height="5" rx="2.5" fill="#b7a77f"/>
  <!-- 近岸石阶 -->
  <rect x="0" y="430" width="800" height="70" fill="#6e5a43"/>
  <rect x="0" y="440" width="800" height="4" fill="#54422f"/>
  <g fill="#4f3c29"><rect x="60" y="446" width="16" height="26"/><rect x="240" y="446" width="16" height="26"/><rect x="470" y="446" width="16" height="26"/><rect x="660" y="446" width="16" height="26"/></g>
  <!-- 近岸房屋檐 -->
  <rect x="600" y="404" width="200" height="10" fill="#4a4a44"/>
  <rect x="620" y="388" width="180" height="6" fill="#4a4a44"/>
  <!-- 乌篷船 -->
  <path d="M120 470 q34 -10 68 0 l-6 18 h-56 Z" fill="#4f3c2c"/>
  <path d="M150 452 q10 -22 22 -26 q12 4 18 26 Z" fill="#3c2c1f"/>
  <rect x="120" y="452" width="80" height="6" rx="3" fill="#5a4633"/>
</svg>
