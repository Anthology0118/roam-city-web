<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="鼓浪屿落日插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b98d"/>
      <stop offset=".5" stop-color="#fbd6ad"/>
      <stop offset="1" stop-color="#fdeeda"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8956f"/>
      <stop offset=".4" stop-color="#7fb8b8"/>
      <stop offset="1" stop-color="#cfe4dd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="400" cy="250" r="46" fill="#fff3d2" opacity=".9"/>
  <circle cx="400" cy="250" r="70" fill="#fff3d2" opacity=".35"/>
  <!-- 落日海面光路 -->
  <rect x="382" y="330" width="36" height="90" fill="#ffe2a8" opacity=".4"/>
  <!-- 远岛 -->
  <path d="M0 360 L120 300 L220 366 L340 318 L430 372 Z" fill="#a06a55" opacity=".6"/>
  <!-- 海 -->
  <rect y="330" width="800" height="170" fill="url(#sea)"/>
  <g stroke="#fff" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M60 352 h70 M180 368 h90 M560 350 h80 M720 374 h60"/>
  </g>
  <!-- 大船 -->
  <g>
    <path d="M90 388 L70 360 L110 376 L150 350 L180 372 L210 388 Z" fill="#5c4a3a"/>
    <rect x="150" y="322" width="12" height="52" fill="#4c3c30"/>
    <path d="M162 322 L236 336 L162 352 Z" fill="#f4ecd8"/>
    <rect x="70" y="380" width="140" height="12" rx="6" fill="#6b4b2f"/>
  </g>
  <!-- 鼓浪屿岛前景（右下） -->
  <path d="M470 500 L470 380 L560 340 L660 396 L800 360 L800 500 Z" fill="#7f8f6b"/>
  <path d="M560 340 q80 -70 180 -44 l60 64 L470 500 L470 380 Z" fill="#6b7d56"/>
  <!-- 岛上建筑 -->
  <g fill="#f4e9d8">
    <rect x="530" y="352" width="52" height="42"/>
    <path d="M525 352 h62 l-6 -10 h-50 Z" fill="#b5584c"/>
    <rect x="552" y="332" width="8" height="10" fill="#b5584c"/>
  </g>
  <g fill="#efe3cf">
    <rect x="620" y="340" width="70" height="56"/>
    <path d="M614 340 h82 l-10 -12 h-62 Z" fill="#8f3b30"/>
    <rect x="648" y="320" width="14" height="20" fill="#8f3b30"/>
    <rect x="636" y="356" width="14" height="16" fill="#7d6a4f"/>
    <rect x="664" y="356" width="14" height="16" fill="#7d6a4f"/>
  </g>
  <!-- 灯塔 -->
  <g>
    <rect x="712" y="296" width="22" height="58" fill="#fff"/>
    <rect x="712" y="296" width="22" height="10" fill="#d94f3d"/>
    <path d="M709 296 h28 l-3 -18 l-6 10 l-6 -10 Z" fill="#c0392b"/>
    <rect x="720" y="246" width="6" height="30" fill="#e8e0c8"/>
    <circle cx="723" cy="244" r="7" fill="#ffd76a"/>
    <ellipse cx="723" cy="258" rx="24" ry="10" fill="#ffe9a8" opacity=".5"/>
  </g>
  <!-- 岸边棕榈 -->
  <g>
    <path d="M470 500 L500 470 L500 470 L470 500 Z" fill="none"/>
  </g>
  <!-- 飞鸟 -->
  <path d="M300 150 q12 -10 24 0 q12 -10 24 0 M360 190 q10 -8 20 0 q10 -8 20 0" stroke="#7c4a3a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".6"/>
</svg>
