<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="桂林漓江插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeae2"/>
      <stop offset=".55" stop-color="#eaf5ee"/>
      <stop offset="1" stop-color="#fdf4e0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7cfc4"/>
      <stop offset="1" stop-color="#eef7ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="610" cy="92" r="30" fill="#fff4d8" opacity=".9"/>
  <circle cx="610" cy="92" r="46" fill="#fff4d8" opacity=".35"/>

  <!-- 远山（最浅） -->
  <path d="M0 420 L0 330 L95 250 L210 350 L300 265 L420 360 L520 240 L640 350 L730 268 L800 330 L800 420 Z" fill="#bfd9cf" opacity=".85"/>
  <!-- 中景峰林 -->
  <path d="M0 440 L0 350 L70 300 L150 372 L260 290 L370 385 L470 300 L560 390 L660 310 L740 372 L800 330 L800 440 Z" fill="#8fb8a6"/>
  <!-- 前景峰（墨绿，最近最实） -->
  <path d="M40 500 L40 360 L120 270 L210 400 L300 340 L400 430 L500 350 L620 460 L700 390 L800 460 L800 500 Z" fill="#3f7d6d"/>
  <path d="M120 270 L96 352 L150 348 Z" fill="#356b5d"/>
  <!-- 水面 -->
  <rect y="400" width="800" height="100" fill="url(#water)"/>
  <!-- 水波 -->
  <path d="M80 432 h90 M240 418 h70 M360 446 h110 M560 428 h80 M690 452 h60" stroke="#ffffff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  <!-- 竹筏与渔翁 -->
  <rect x="300" y="428" width="92" height="7" rx="3.5" fill="#6a4b2c"/>
  <path d="M330 428 q4 -16 10 -22 M354 428 q4 -16 10 -22" stroke="#6a4b2c" stroke-width="2" fill="none"/>
  <circle cx="368" cy="414" r="4" fill="#2b3a33"/>
  <rect x="366" y="396" width="3" height="18" rx="1.5" fill="#7c4a21" transform="rotate(12 367 405)"/>
  <circle cx="330" cy="406" r="4" fill="#2b3a33"/>
  <path d="M326 406 L318 392 L334 400 Z" fill="#7c4a21"/>
  <!-- 飞鸟 -->
  <path d="M520 120 q10 -8 20 0 q10 -8 20 0 M560 150 q9 -7 18 0 q9 -7 18 0" stroke="#3f7d6d" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".6"/>
</svg>
