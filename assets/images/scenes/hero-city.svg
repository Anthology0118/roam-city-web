<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="山海之城夜景插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset=".55" stop-color="#26315e"/>
      <stop offset=".8" stop-color="#5a4a80"/>
      <stop offset="1" stop-color="#a46476"/>
    </linearGradient>
    <!-- 城市窗户光点平铺 pattern -->
    <pattern id="win" width="14" height="16" patternUnits="userSpaceOnUse">
      <rect x="3"  y="3"  width="3" height="5" fill="#ffd87a" opacity=".9"/>
      <rect x="9"  y="3"  width="3" height="5" fill="#ffe9b0" opacity=".7"/>
      <rect x="9"  y="11" width="3" height="4" fill="#ffd87a" opacity=".55"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#2c2a52"/>
    </linearGradient>
  </defs>
  <rect width="800" height="330" fill="url(#sky)"/>
  <!-- 星与月 -->
  <circle cx="650" cy="74" r="26" fill="#ffe9b8"/>
  <circle cx="650" cy="74" r="40" fill="#ffe9b8" opacity=".18"/>
  <g fill="#fff">
    <circle cx="90" cy="60" r="1.8"/><circle cx="180" cy="120" r="1.5"/><circle cx="300" cy="52" r="2"/>
    <circle cx="430" cy="96" r="1.5"/><circle cx="520" cy="40" r="1.8"/><circle cx="760" cy="130" r="1.6"/>
    <circle cx="230" cy="190" r="1.4"/><circle cx="120" cy="150" r="1.3"/>
  </g>
  <!-- 远岸剪影（山） -->
  <path d="M0 330 L0 250 L80 210 L170 280 L250 205 L360 300 L470 230 L560 305 L700 220 L800 300 L800 330 Z" fill="#242b4a"/>
  <!-- 高楼群（有窗） -->
  <g>
    <rect x="40" y="150" width="46" height="180" fill="#20263f"/>
    <rect x="42" y="152" width="42" height="150" fill="url(#win)" opacity=".9"/>

    <rect x="100" y="120" width="56" height="210" fill="#2a3150"/>
    <rect x="102" y="122" width="52" height="180" fill="url(#win)" opacity=".85"/>
    <rect x="112" y="70" width="12" height="50" fill="#2a3150"/>
    <circle cx="118" cy="64" r="7" fill="#d9443f" opacity=".9"/>

    <rect x="170" y="170" width="40" height="160" fill="#1c2139"/>
    <rect x="172" y="172" width="36" height="130" fill="url(#win)" opacity=".7"/>

    <rect x="500" y="140" width="50" height="190" fill="#242a47"/>
    <rect x="502" y="142" width="46" height="160" fill="url(#win)" opacity=".9"/>

    <rect x="562" y="180" width="42" height="150" fill="#1e2440"/>
    <rect x="564" y="182" width="38" height="120" fill="url(#win)" opacity=".75"/>

    <rect x="620" y="120" width="60" height="210" fill="#2b3254"/>
    <rect x="622" y="122" width="56" height="180" fill="url(#win)" opacity=".85"/>
    <rect x="648" y="70" width="14" height="50" fill="#2b3254"/>
    <path d="M650 70 l-30 34 M650 70 l30 34 M650 70 l-18 -34 M650 70 l18 -34" stroke="#7fc9e8" stroke-width="1.4" fill="none" opacity=".7"/>

    <rect x="700" y="160" width="46" height="170" fill="#20263f"/>
    <rect x="702" y="162" width="42" height="140" fill="url(#win)" opacity=".8"/>
  </g>
  <!-- 中部连桥/塔吊 -->
  <rect x="300" y="236" width="140" height="8" fill="#12152a"/>
  <rect x="356" y="200" width="10" height="44" fill="#3a4566"/>
  <rect x="300" y="210" width="140" height="6" fill="#3a4566" opacity=".8"/>
  <!-- 近岸建筑块 -->
  <rect x="0" y="300" width="800" height="30" fill="#141830"/>
  <g fill="#0f1426">
    <rect x="20" y="270" width="40" height="30"/><rect x="210" y="262" width="50" height="38"/>
    <rect x="360" y="270" width="44" height="30"/><rect x="520" y="258" width="60" height="42"/>
    <rect x="720" y="272" width="52" height="28"/>
  </g>
  <!-- 水面 -->
  <rect y="330" width="800" height="170" fill="url(#water)"/>
  <!-- 灯光倒影 -->
  <g fill="#ffd87a">
    <rect x="104" y="336" width="3" height="12" opacity=".6"/><rect x="118" y="344" width="3" height="10" opacity=".5"/>
    <rect x="518" y="332" width="3" height="14" opacity=".6"/><rect x="638" y="338" width="3" height="12" opacity=".55"/>
    <rect x="44" y="342" width="3" height="9" opacity=".4"/><rect x="712" y="336" width="3" height="11" opacity=".5"/>
  </g>
  <!-- 水面波光 -->
  <path d="M60 380 h90 M200 360 h70 M330 420 h120 M500 356 h80 M620 430 h100 M760 380 h60" stroke="#3f4a76" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M80 460 h70 M260 470 h120 M560 460 h80" stroke="#2a3560" stroke-width="3" stroke-linecap="round"/>
</svg>
