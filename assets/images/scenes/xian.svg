<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="西安古城墙夜景插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2a52"/>
      <stop offset=".5" stop-color="#7a4a78"/>
      <stop offset="1" stop-color="#d98a5f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- 月亮与星 -->
  <circle cx="620" cy="90" r="26" fill="#ffe9b0" opacity=".95"/>
  <circle cx="620" cy="90" r="40" fill="#ffe9b0" opacity=".2"/>
  <g fill="#fff">
    <circle cx="120" cy="70" r="2"/><circle cx="200" cy="130" r="1.6"/><circle cx="330" cy="50" r="2.2"/>
    <circle cx="470" cy="90" r="1.6"/><circle cx="720" cy="180" r="2"/><circle cx="90" cy="180" r="1.6"/>
    <circle cx="540" cy="46" r="1.8"/><circle cx="680" cy="60" r="1.4"/>
  </g>
  <!-- 城内房舍剪影 -->
  <path d="M0 430 L0 360 q30 -16 60 0 q30 -16 60 0 q30 -16 60 0 q30 -16 60 0 q30 -16 60 0 q30 -16 60 0 q30 -16 60 0 L420 430 Z" fill="#3a2040" opacity=".5"/>
  <g fill="#ffd87a">
    <rect x="60" y="366" width="8" height="10" opacity=".9"/><rect x="120" y="380" width="8" height="10" opacity=".7"/>
    <rect x="200" y="360" width="8" height="10" opacity=".85"/><rect x="300" y="378" width="8" height="10" opacity=".7"/>
  </g>
  <!-- 城墙主体 -->
  <rect x="0" y="430" width="800" height="36" fill="#7a3b30"/>
  <rect x="0" y="466" width="800" height="34" fill="#5d2a22"/>
  <!-- 垛口 -->
  <g fill="#6a3329">
    <rect x="20" y="416" width="18" height="16"/><rect x="54" y="416" width="18" height="16"/>
    <rect x="88" y="416" width="18" height="16"/><rect x="560" y="416" width="18" height="16"/>
    <rect x="594" y="416" width="18" height="16"/><rect x="628" y="416" width="18" height="16"/>
    <rect x="662" y="416" width="18" height="16"/><rect x="696" y="416" width="18" height="16"/>
    <rect x="730" y="416" width="18" height="16"/><rect x="764" y="416" width="18" height="16"/>
  </g>
  <!-- 城门箭楼 -->
  <rect x="330" y="316" width="140" height="114" fill="#8f4a35"/>
  <rect x="314" y="300" width="172" height="30" fill="#6a3329"/>
  <rect x="400" y="276" width="0" height="0"/>
  <path d="M330 336 L360 300 h140 l-30 36 Z" fill="#5d2a22"/>
  <g fill="#ffd87a">
    <rect x="348" y="330" width="16" height="22" opacity=".95"/><rect x="378" y="330" width="16" height="22" opacity=".8"/>
    <rect x="406" y="330" width="16" height="22" opacity=".95"/><rect x="434" y="330" width="16" height="22" opacity=".8"/>
  </g>
  <g fill="#ffcf7e">
    <rect x="348" y="366" width="16" height="22" opacity=".7"/><rect x="378" y="366" width="16" height="22" opacity=".9"/>
    <rect x="406" y="366" width="16" height="22" opacity=".7"/><rect x="434" y="366" width="16" height="22" opacity=".9"/>
  </g>
  <!-- 门洞 -->
  <rect x="376" y="414" width="48" height="52" rx="24" fill="#2b1613"/>
  <!-- 灯笼 -->
  <g>
    <circle cx="330" cy="438" r="9" fill="#ff6a3d" opacity=".95"/><circle cx="470" cy="438" r="9" fill="#ff6a3d" opacity=".95"/>
    <line x1="330" y1="429" x2="330" y2="422" stroke="#5d2a22" stroke-width="2"/>
    <line x1="470" y1="429" x2="470" y2="422" stroke="#5d2a22" stroke-width="2"/>
    <rect x="140" y="436" width="12" height="18" rx="6" fill="#ff8f4f"/><rect x="640" y="436" width="12" height="18" rx="6" fill="#ff8f4f"/>
  </g>
  <!-- 灯笼光晕 -->
  <ellipse cx="330" cy="452" rx="40" ry="12" fill="#ff9a5f" opacity=".18"/>
  <ellipse cx="470" cy="452" rx="40" ry="12" fill="#ff9a5f" opacity=".18"/>
