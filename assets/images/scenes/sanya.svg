<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="三亚亚龙湾插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc0ea"/>
      <stop offset=".55" stop-color="#b7e4f4"/>
      <stop offset="1" stop-color="#ffe6c2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa9c9"/>
      <stop offset=".5" stop-color="#57c7d8"/>
      <stop offset="1" stop-color="#cfeef0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="620" cy="140" r="30" fill="#fff6cf" opacity=".95"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="150" cy="80" rx="70" ry="18"/><ellipse cx="200" cy="72" rx="36" ry="13"/>
    <ellipse cx="420" cy="60" rx="55" ry="15"/><ellipse cx="470" cy="52" rx="30" ry="11"/>
  </g>
  <!-- 远海岛 -->
  <path d="M120 330 L180 250 L240 330 Z" fill="#8fc0bd" opacity=".6"/>
  <!-- 海面 -->
  <rect y="300" width="800" height="120" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M120 326 h80 M250 344 h110 M440 318 h90 M90 372 h70 M700 340 h90"/>
  </g>
  <!-- 帆船 -->
  <g>
    <path d="M560 352 L560 292 L520 340 Z" fill="#fff"/>
    <path d="M560 352 L560 282 L602 340 Z" fill="#f7c948"/>
    <path d="M548 352 L548 352 L548 352 L548 352 Z" fill="none"/>
    <rect x="548" y="350" width="26" height="5" rx="2.5" fill="#7c4a21"/>
    <path d="M554 330 L618 342 L554 356 Z" fill="#fff" opacity=".2"/>
  </g>
  <!-- 沙滩 -->
  <path d="M0 420 q120 -24 300 -6 q220 20 500 0 L800 420 L800 500 L0 500 Z" fill="#f6e2b6"/>
  <path d="M0 432 q120 -18 300 -4 q220 14 500 0 L800 432 L800 500 L0 500 Z" fill="#edcd97"/>
  <!-- 海浪白边 -->
  <path d="M0 420 q80 10 160 -4 q80 -14 160 0 q80 14 160 -2 q90 -18 160 0 L800 416" stroke="#bfe9e2" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 冲浪/游泳的人 -->
  <circle cx="300" cy="360" r="6" fill="#e0532f"/>
  <rect x="0" y="0" width="0" height="0"/>
  <!-- 遮阳伞 -->
  <g>
    <path d="M160 388 L128 388 L144 366 Z" fill="#f2601e"/>
    <line x1="144" y1="388" x2="140" y2="414" stroke="#7c5a3a" stroke-width="3"/>
    <path d="M112 388 L128 356 L144 388 Z" fill="#ffb26b"/>
  </g>
  <!-- 椰子树 -->
  <g>
    <path d="M680 470 q4 -80 20 -120 L668 356 q30 -10 46 6 l-16 6 q6 -70 -10 -108 l-12 2 q2 40 0 120 Z" fill="#8a5a30"/>
    <g fill="#2f8a5b">
      <path d="M668 356 q-26 -18 -58 -10 q26 4 44 18 q-10 -26 -44 -34 q40 6 58 26 Z"/>
      <path d="M714 362 q30 -12 54 -2 q-30 8 -48 22 q14 -26 54 -24 q-40 12 -60 4 Z"/>
      <path d="M686 346 q6 -28 30 -36 q-12 28 2 40 q-22 -8 -32 6 Z"/>
      <path d="M660 342 q-8 -26 -30 -36 q8 30 -2 42 q20 -6 32 4 Z"/>
    </g>
    <g fill="#6b3f1e">
      <circle cx="672" cy="346" r="5"/><circle cx="700" cy="354" r="5"/><circle cx="684" cy="330" r="5"/>
    </g>
  </g>
</svg>
