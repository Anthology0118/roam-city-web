<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="故宫太和殿插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8dc"/>
      <stop offset="1" stop-color="#bcd7ec"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c33a2a"/>
      <stop offset="1" stop-color="#9e2417"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- 祥云 -->
  <g fill="#fff" opacity=".55">
    <ellipse cx="120" cy="90" rx="60" ry="16"/>
    <ellipse cx="700" cy="120" rx="70" ry="16"/>
    <ellipse cx="660" cy="105" rx="34" ry="12"/>
  </g>
  <!-- 汉白玉台基 -->
  <rect x="0" y="430" width="800" height="24" fill="#efe9da"/>
  <rect x="0" y="454" width="800" height="46" fill="#dcd3bd"/>
  <g fill="#beb49b">
    <rect x="160" y="428" width="10" height="30"/><rect x="340" y="428" width="10" height="30"/>
    <rect x="450" y="428" width="10" height="30"/><rect x="630" y="428" width="10" height="30"/>
  </g>
  <!-- 大殿下层红墙 -->
  <rect x="210" y="330" width="380" height="100" fill="url(#wall)"/>
  <rect x="210" y="330" width="380" height="14" fill="#8f1d12"/>
  <!-- 大殿金顶（重檐庑殿顶） -->
  <g>
    <rect x="178" y="252" width="444" height="34" fill="#f5c33c"/>
    <path d="M178 252 L236 210 h328 l58 42 Z" fill="#e8a92c"/>
    <rect x="236" y="218" width="328" height="7" fill="#a37218"/>
    <path d="M200 286 L160 330 h480 L600 286 Z" fill="#f5c33c"/>
    <rect x="160" y="330" width="480" height="16" fill="#8f1d12"/>
    <!-- 脊兽点 -->
    <circle cx="236" cy="250" r="4" fill="#a37218"/><circle cx="564" cy="250" r="4" fill="#a37218"/>
  </g>
  <!-- 二层腰檐与窗 -->
  <rect x="252" y="286" width="296" height="44" fill="url(#wall)"/>
  <g fill="#fff3c4"><rect x="300" y="298" width="26" height="24"/><rect x="350" y="298" width="26" height="24"/>
  <rect x="400" y="298" width="26" height="24"/><rect x="450" y="298" width="26" height="24"/></g>
  <g stroke="#caa53a" stroke-width="2" fill="none">
    <rect x="300" y="298" width="26" height="24"/><rect x="350" y="298" width="26" height="24"/>
    <rect x="400" y="298" width="26" height="24"/><rect x="450" y="298" width="26" height="24"/>
  </g>
  <!-- 中门 -->
  <rect x="378" y="398" width="44" height="32" rx="3" fill="#5c1208"/>
  <circle cx="410" cy="414" r="3" fill="#e6c36a"/>
  <!-- 广场侧墙 -->
  <rect x="0" y="420" width="210" height="34" fill="#b02a1b"/>
  <rect x="590" y="420" width="210" height="34" fill="#b02a1b"/>
  <g fill="#a02418">
    <rect x="70" y="400" width="26" height="20"/><rect x="200" y="400" width="26" height="20"/>
    <rect x="590" y="400" width="26" height="20"/><rect x="720" y="400" width="26" height="20"/>
  </g>
  <!-- 红墙横线 -->
  <rect x="0" y="420" width="800" height="6" fill="#9e2417"/>
</svg>
